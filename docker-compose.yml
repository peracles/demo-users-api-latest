services:
  # ============================================
  # BASES DE DATOS
  # ============================================
  postgres-auth:
    image: postgres:17-alpine
    container_name: demo-postgres-auth
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./init-scripts/auth-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:17-alpine
    container_name: demo-postgres-users
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_password
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
      - ./init-scripts/users-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_user -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MICROSERVICIOS
  # ============================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: demo-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      JWT_KEYS_DIR: /app/keys
      USER_SERVICE_URL: http://user-service:8080
    volumes:
      - jwt-keys:/app/keys
    depends_on:
      postgres-auth:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service/UserApi
      dockerfile: Dockerfile
    container_name: demo-user-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      URLS: http://+:8080
      ConnectionStrings__UsersDb: Host=postgres-users;Port=5432;Database=users_db;Username=users_user;Password=users_password
      JwtKeysDir: /app/keys
    volumes:
      - jwt-keys:/app/keys
    depends_on:
      postgres-users:
        condition: service_healthy

  # ============================================
  # API GATEWAY
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: demo-nginx-gateway
    restart: unless-stopped
    ports:
      - "8880:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"

volumes:
  postgres_auth_data:
  postgres_users_data:
  jwt-keys:
  frontend_node_modules:

networks:
  default:
    name: demo-network
